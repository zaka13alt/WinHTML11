<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --input-bg: #2a2a2a;
            --accent: #4dadff;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* Search Header Styles */
        .header-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1rem;
            color: var(--text-color);
            background-color: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(77, 173, 255, 0.4);
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        /* Grid Styles */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #333;
        }

        .info {
            padding: 15px;
        }

        .title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .author {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .author a {
            color: var(--accent);
            text-decoration: none;
        }

        .author a:hover {
            text-decoration: underline;
        }

        /* Overlay Styles */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
        }

        .overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-hint {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* Black Round Close Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #333333;
            border-radius: 50%;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s;
            z-index: 1001;
        }

        .close-btn:hover {
            background-color: #1a1a1a;
            transform: scale(1.05);
        }

        .close-btn:active {
            transform: scale(0.95);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <input type="text" id="search-input" class="search-box" placeholder="Search games or authors...">
    </div>

    <div class="grid" id="game-grid"></div>

    <div class="overlay" id="game-overlay">
        <div class="close-hint">Press ESC to exit</div>
        <button class="close-btn" id="close-btn" aria-label="Close game">✕</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const COVER_BASE = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/";
        const HTML_BASE = "https://raw.esm.sh/gh/freebuisness/html";

        const grid = document.getElementById('game-grid');
        const overlay = document.getElementById('game-overlay');
        const iframe = document.getElementById('game-frame');
        const searchInput = document.getElementById('search-input');
        const closeBtn = document.getElementById('close-btn');

        let allGames = [];

        async function loadGames() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json');
                allGames = await response.json();
                renderCards(allGames);
            } catch (error) {
                console.error("Error loading games:", error);
            }
        }

        function renderCards(games) {
            grid.innerHTML = '';
            
            if (games.length === 0) {
                grid.innerHTML = '<div class="no-results">No games found matching your search.</div>';
                return;
            }

            games.forEach(game => {
                const imgUrl = game.cover ? game.cover.replace('{COVER_URL}', COVER_BASE) : '';
                const gameUrl = game.url ? game.url.replace('{HTML_URL}', HTML_BASE) : '#';
                const gameName = game.name || 'Untitled Game';
                const gameAuthor = game.author || 'Unknown Author';
                const authorLink = game.authorLink || '#';

                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${gameName}" loading="lazy">
                    <div class="info">
                        <div class="title">${gameName}</div>
                        <div class="author">By: <a href="${authorLink}" target="_blank" rel="noopener">${gameAuthor}</a></div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'A' && gameUrl !== '#') {
                        openGame(gameUrl);
                    }
                });

                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            const filteredGames = allGames.filter(game => {
                const matchName = (game?.name || '').toLowerCase().includes(searchTerm);
                const matchAuthor = (game?.author || '').toLowerCase().includes(searchTerm);
                return matchName || matchAuthor;
            });

            renderCards(filteredGames);
        });

        function openGame(url) {
            iframe.src = url;
            overlay.style.display = 'block';
            window.focus(); 
        }

        function closeGame() {
            overlay.style.display = 'none';
            iframe.src = '';
        }

        // Close on button click
        closeBtn.addEventListener('click', closeGame);

        // Close on ESC key press
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.style.display === 'block') {
                closeGame();
            }
        });
        
        loadGames();
    </script>
</body>
</html>
